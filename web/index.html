<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHOP.JAVA — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a3d;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --danger: #ff4d6d;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg-orbs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
      animation: float 8s ease-in-out infinite;
    }
    .orb1 { width:400px; height:400px; background:var(--accent); top:-100px; left:-100px; animation-delay:0s; }
    .orb2 { width:300px; height:300px; background:var(--accent2); bottom:-80px; right:-80px; animation-delay:3s; }
    .orb3 { width:200px; height:200px; background:var(--accent3); top:50%; left:60%; animation-delay:5s; }
    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      padding: 20px;
    }

    .logo {
      text-align: center; margin-bottom: 40px;
      animation: slideDown 0.6s ease;
    }
    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }
    .logo p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      animation: slideUp 0.6s ease;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    .tabs {
      display: flex; gap: 0;
      background: var(--surface2);
      border-radius: 12px; padding: 4px;
      margin-bottom: 28px;
    }
    .tab {
      flex: 1; padding: 10px;
      border: none; background: none;
      color: var(--muted); cursor: pointer;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      transition: all 0.3s;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 15px rgba(108,99,255,0.4);
    }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; margin-bottom: 7px;
      font-size: 0.8rem; font-weight: 500;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%; padding: 13px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }

    .btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none; border-radius: 12px;
      color: #fff; cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 1rem; font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s;
      margin-top: 8px;
      position: relative; overflow: hidden;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(108,99,255,0.5);
    }
    .btn:active { transform: translateY(0); }
    .btn.loading { opacity: 0.7; pointer-events: none; }

    .msg {
      padding: 12px 16px; border-radius: 10px;
      font-size: 0.85rem; margin-top: 14px; display: none;
    }
    .msg.error { background: rgba(255,77,109,0.15); border: 1px solid rgba(255,77,109,0.3); color: #ff8fab; }
    .msg.success { background: rgba(67,233,123,0.15); border: 1px solid rgba(67,233,123,0.3); color: #43e97b; }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    @keyframes slideDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="container">
    <div class="logo">
      <h1>SHOP.JAVA</h1>
      <p>Your modern e-commerce platform</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <div class="form-panel active" id="loginPanel">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="admin@shop.com"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="••••••••"/>
        </div>
        <button class="btn" onclick="handleLogin()">Sign In →</button>
        <div class="msg" id="loginMsg"></div>
      </div>

      <!-- Register Form -->
      <div class="form-panel" id="registerPanel">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Ishu Rana"/>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="ishu@gmail.com"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="••••••••"/>
        </div>
        <button class="btn" onclick="handleRegister()">Create Account →</button>
        <div class="msg" id="registerMsg"></div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
      document.getElementById('loginPanel').classList.toggle('active', tab==='login');
      document.getElementById('registerPanel').classList.toggle('active', tab==='register');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text; el.className = `msg ${type}`; el.style.display = 'block';
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPass').value.trim();
      if (!email || !pass) { showMsg('loginMsg','Please fill all fields','error'); return; }

      try {
        const res  = await fetch('http://localhost:8080/ECommerceApp/LoginServlet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}`
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = data.user.role === 'admin' ? 'pages/admin.html' : 'pages/customer.html';
        } else {
          showMsg('loginMsg', data.message || 'Invalid credentials', 'error');
        }
      } catch(e) {
        showMsg('loginMsg','Cannot connect to server. Is Tomcat running?','error');
      }
    }

    async function handleRegister() {
      const name  = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass  = document.getElementById('regPass').value.trim();
      if (!name||!email||!pass) { showMsg('registerMsg','Please fill all fields','error'); return; }

      try {
        const res  = await fetch('http://localhost:8080/ECommerceApp/RegisterServlet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}`
        });
        const data = await res.json();
        if (data.success) {
          showMsg('registerMsg','Account created! Please login.','success');
          setTimeout(() => switchTab('login'), 1500);
        } else {
          showMsg('registerMsg', data.message || 'Registration failed', 'error');
        }
      } catch(e) {
        showMsg('registerMsg','Cannot connect to server. Is Tomcat running?','error');
      }
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginPanel').classList.contains('active')) handleLogin();
        else handleRegister();
      }
    });
  </script>
</body>
</html>
