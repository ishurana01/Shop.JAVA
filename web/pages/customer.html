<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHOP.JAVA — Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a26;
      --border:#2a2a3d; --accent:#6c63ff; --accent2:#ff6584;
      --accent3:#43e97b; --text:#e8e8f0; --muted:#6b6b8a; --danger:#ff4d6d;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

    /* NAV */
    nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 32px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top:0; z-index: 100;
    }
    .nav-logo { font-family:'Syne',sans-serif; font-size:1.3rem; font-weight:800;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent; }
    .nav-right { display:flex; align-items:center; gap:16px; }
    .nav-user { color:var(--muted); font-size:0.85rem; }
    .cart-btn {
      background:var(--accent); border:none; color:#fff; padding:9px 18px;
      border-radius:10px; cursor:pointer; font-family:'Syne',sans-serif;
      font-weight:700; font-size:0.85rem; display:flex; align-items:center; gap:8px;
      transition:all 0.3s;
    }
    .cart-btn:hover { transform:translateY(-1px); box-shadow:0 5px 15px rgba(108,99,255,0.4); }
    .cart-count {
      background:#fff; color:var(--accent); border-radius:50%;
      width:20px; height:20px; display:flex; align-items:center; justify-content:center;
      font-size:0.75rem; font-weight:800;
    }
    .logout-btn {
      background:none; border:1px solid var(--border); color:var(--muted);
      padding:8px 14px; border-radius:10px; cursor:pointer; font-size:0.8rem;
      transition:all 0.3s;
    }
    .logout-btn:hover { border-color:var(--danger); color:var(--danger); }

    /* MAIN LAYOUT */
    .layout { display:flex; height:calc(100vh - 64px); }

    /* SIDEBAR */
    .sidebar {
      width:260px; background:var(--surface); border-right:1px solid var(--border);
      padding:24px; overflow-y:auto; flex-shrink:0;
    }
    .sidebar h3 { font-family:'Syne',sans-serif; font-size:0.75rem;
      text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:12px; }
    .category-list { list-style:none; }
    .category-list li {
      padding:10px 14px; border-radius:10px; cursor:pointer;
      font-size:0.9rem; color:var(--muted); transition:all 0.2s; margin-bottom:4px;
    }
    .category-list li:hover, .category-list li.active {
      background:rgba(108,99,255,0.15); color:var(--accent);
    }
    .search-box {
      width:100%; padding:11px 14px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:12px; color:var(--text);
      font-family:'DM Sans',sans-serif; font-size:0.9rem;
      outline:none; transition:all 0.3s; margin-bottom:20px;
    }
    .search-box:focus { border-color:var(--accent); }

    /* PRODUCTS */
    .main { flex:1; overflow-y:auto; padding:28px; }
    .main h2 { font-family:'Syne',sans-serif; font-size:1.4rem; margin-bottom:20px; }
    .products-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px;
    }
    .product-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:16px; padding:20px; transition:all 0.3s;
      animation: fadeIn 0.4s ease;
    }
    .product-card:hover { transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 30px rgba(108,99,255,0.15); }
    .product-badge {
      display:inline-block; padding:4px 10px; border-radius:20px;
      font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;
      margin-bottom:12px;
    }
    .product-img-wrap {
    width: 100%;
    height: 160px;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 14px;
    background: var(--surface2);
}
.product-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
}
.product-card:hover .product-img {
    transform: scale(1.05);
}
    .badge-Electronics { background:rgba(108,99,255,0.2); color:var(--accent); }
    .badge-Footwear    { background:rgba(255,101,132,0.2); color:var(--accent2); }
    .badge-Books       { background:rgba(67,233,123,0.2); color:var(--accent3); }
    .badge-default     { background:rgba(255,255,255,0.1); color:var(--muted); }

    .product-name { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; margin-bottom:6px; }
    .product-price { font-size:1.2rem; font-weight:700; color:var(--accent3); margin-bottom:4px; }
    .product-stock { font-size:0.78rem; color:var(--muted); margin-bottom:16px; }
    .add-btn {
      width:100%; padding:10px; background:var(--surface2);
      border:1px solid var(--border); border-radius:10px;
      color:var(--text); cursor:pointer; font-family:'Syne',sans-serif;
      font-weight:600; font-size:0.85rem; transition:all 0.3s; display:flex;
      align-items:center; justify-content:center; gap:6px;
    }
    .add-btn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* CART PANEL */
    .cart-panel {
      width:340px; background:var(--surface); border-left:1px solid var(--border);
      padding:24px; display:flex; flex-direction:column;
      transform:translateX(100%); transition:transform 0.3s ease;
      position:fixed; right:0; top:64px; bottom:0; z-index:50;
    }
    .cart-panel.open { transform:translateX(0); }
    .cart-panel h3 { font-family:'Syne',sans-serif; font-size:1.1rem; margin-bottom:20px; }
    .cart-items { flex:1; overflow-y:auto; }
    .cart-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 0; border-bottom:1px solid var(--border);
    }
    .cart-item-info { flex:1; }
    .cart-item-name { font-size:0.9rem; font-weight:500; }
    .cart-item-price { font-size:0.8rem; color:var(--muted); }
    .cart-item-qty {
      display:flex; align-items:center; gap:8px; margin-left:12px;
    }
    .qty-btn {
      width:26px; height:26px; border-radius:6px;
      background:var(--surface2); border:1px solid var(--border);
      color:var(--text); cursor:pointer; font-size:0.9rem; transition:all 0.2s;
    }
    .qty-btn:hover { background:var(--accent); border-color:var(--accent); }
    .cart-footer { margin-top:16px; }
    .cart-total {
      display:flex; justify-content:space-between;
      font-family:'Syne',sans-serif; font-weight:700;
      font-size:1rem; margin-bottom:6px;
    }
    .cart-gst { display:flex; justify-content:space-between; font-size:0.8rem; color:var(--muted); margin-bottom:16px; }
    .checkout-btn {
      width:100%; padding:14px;
      background:linear-gradient(135deg,var(--accent3),#00c9a7);
      border:none; border-radius:12px; color:#000;
      font-family:'Syne',sans-serif; font-weight:800;
      font-size:0.95rem; cursor:pointer; transition:all 0.3s;
    }
    .checkout-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(67,233,123,0.4); }
    .empty-cart { text-align:center; color:var(--muted); margin-top:60px; }
    .empty-cart div { font-size:3rem; margin-bottom:12px; }

    /* TOAST */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px);
      background:var(--surface2); border:1px solid var(--border);
      padding:12px 24px; border-radius:12px; font-size:0.9rem;
      transition:transform 0.3s; z-index:200;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }

    .loading { text-align:center; color:var(--muted); padding:60px; font-size:0.9rem; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">SHOP.JAVA</div>
    <div class="nav-right">
   <span class="nav-user" id="navUser"
   onclick="window.location.href='profile.html'"
  style="cursor:pointer; transition:color 0.2s;"
  onmouseover="this.style.color='#6c63ff'"
  onmouseout="this.style.color=''">
  Welcome!
</span>
      <button class="cart-btn" onclick="toggleCart()">
        🛒 Cart <span class="cart-count" id="cartCount">0</span>
      </button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <input class="search-box" type="text" placeholder="🔍 Search products..." id="searchBox" oninput="filterProducts()"/>
      <h3>Categories</h3>
      <ul class="category-list">
        <li class="active" onclick="filterCategory('All', this)">All Products</li>
        <li onclick="filterCategory('Electronics', this)">Electronics</li>
        <li onclick="filterCategory('Footwear', this)">Footwear</li>
        <li onclick="filterCategory('Books', this)">Books</li>
      </ul>
    </div>

    <!-- Products -->
    <div class="main">
      <h2>Browse Products</h2>
      <div class="products-grid" id="productsGrid">
        <div class="loading">Loading products...</div>
      </div>
    </div>

    <!-- Cart Panel -->
    <div class="cart-panel" id="cartPanel">
      <h3>🛒 Your Cart</h3>
      <div class="cart-items" id="cartItems">
        <div class="empty-cart"><div>🛍️</div>Your cart is empty</div>
      </div>
      <div class="cart-footer" id="cartFooter" style="display:none">
        <div class="cart-total"><span>Subtotal</span><span id="cartSubtotal">Rs.0</span></div>
        <div class="cart-gst"><span>GST 18%</span><span id="cartGst">Rs.0</span></div>
        <div class="cart-total"><span>Total</span><span id="cartTotal" style="color:var(--accent3)">Rs.0</span></div>
        <button class="checkout-btn" onclick="goCheckout()">Proceed to Checkout →</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    let currentCategory = 'All';
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    document.getElementById('navUser').textContent = `Hi, ${user.name || 'Guest'}!`;

    // Load products from servlet
    async function loadProducts() {
      try {
        const res = await fetch('http://localhost:8080/ECommerceApp/ProductServlet');
        const data = await res.json();
        allProducts = data.products || [];
        renderProducts(allProducts);
      } catch(e) {
        // Demo mode - show sample products if server not available
        allProducts = [
          {productId:1, name:'iPhone 15', category:'Electronics', price:79999, stock:10},
          {productId:2, name:'Nike Shoes', category:'Footwear', price:4999, stock:25},
          {productId:3, name:'Java Book', category:'Books', price:599, stock:50},
          {productId:4, name:'Headphones', category:'Electronics', price:1999, stock:15},
        ];
        renderProducts(allProducts);
      }
    }

    function renderProducts(products) {
    const grid = document.getElementById('productsGrid');
    if (!products.length) {
        grid.innerHTML = '<div class="loading">No products found.</div>';
        return;
    }
    grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-img-wrap">
            <img
              src="${p.imageUrl && p.imageUrl !== '' ? p.imageUrl : 'https://via.placeholder.com/300x200/1a1a26/6c63ff?text=' + encodeURIComponent(p.name)}"
              alt="${p.name}"
              class="product-img"
              onerror="this.src='https://via.placeholder.com/300x200/1a1a26/6c63ff?text=No+Image'"
            />
          </div>
          <span class="product-badge badge-${p.category}">${p.category || 'General'}</span>
          <div class="product-name">${p.name}</div>
          <div class="product-price">Rs.${p.price.toLocaleString()}</div>
          <div class="product-stock">Stock: ${p.stock} units</div>
          <button class="add-btn" onclick="addToCart(${JSON.stringify(p).replace(/"/g,'&quot;')})">
            + Add to Cart
          </button>
        </div>
    `).join('');
}

    function filterCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.category-list li').forEach(li => li.classList.remove('active'));
      el.classList.add('active');
      filterProducts();
    }

    function filterProducts() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      let filtered = allProducts;
      if (currentCategory !== 'All') filtered = filtered.filter(p => p.category === currentCategory);
      if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
      renderProducts(filtered);
    }

    function addToCart(product) {
      const existing = cart.find(i => i.productId === product.productId);
      if (existing) {
        if (existing.qty >= product.stock) { showToast('❌ Not enough stock!'); return; }
        existing.qty++;
      } else {
        cart.push({...product, qty:1});
      }
      saveCart();
      showToast(`✅ ${product.name} added to cart!`);
    }

    function changeQty(productId, delta) {
      const item = cart.find(i => i.productId === productId);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.productId !== productId);
      saveCart(); renderCart();
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount(); renderCart();
    }

    function updateCartCount() {
      const total = cart.reduce((s,i) => s+i.qty, 0);
      document.getElementById('cartCount').textContent = total;
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      const footer = document.getElementById('cartFooter');
      if (!cart.length) {
        container.innerHTML = '<div class="empty-cart"><div>🛍️</div>Your cart is empty</div>';
        footer.style.display = 'none'; return;
      }
      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">Rs.${(item.price * item.qty).toLocaleString()}</div>
          </div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="changeQty(${item.productId},-1)">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.productId},1)">+</button>
          </div>
        </div>
      `).join('');
      const subtotal = cart.reduce((s,i) => s + i.price*i.qty, 0);
      const gst = subtotal * 0.18;
      document.getElementById('cartSubtotal').textContent = `Rs.${subtotal.toLocaleString()}`;
      document.getElementById('cartGst').textContent = `Rs.${Math.round(gst).toLocaleString()}`;
      document.getElementById('cartTotal').textContent = `Rs.${Math.round(subtotal+gst).toLocaleString()}`;
      footer.style.display = 'block';
    }

    function toggleCart() {
      document.getElementById('cartPanel').classList.toggle('open');
    }

   function goCheckout() {
    if (cart.length === 0) {
        showToast('❌ Cart is empty!');
        return;
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    window.location.href = 'checkout.html';
}

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function logout() {
      localStorage.clear();
      window.location.href = '../index.html';
    }

    loadProducts();
    updateCartCount();
    renderCart();
  </script>
</body>
</html>
