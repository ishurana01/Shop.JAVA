<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHOP.JAVA — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3d;--accent:#6c63ff;--accent2:#ff6584;--accent3:#43e97b;--text:#e8e8f0;--muted:#6b6b8a;--danger:#ff4d6d;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;}

    nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .nav-logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .admin-badge{background:rgba(255,101,132,0.15);color:var(--accent2);padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:0.5px;}
    .logout-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:0.8rem;transition:all 0.3s;}
    .logout-btn:hover{border-color:var(--danger);color:var(--danger);}

    .layout{display:flex;flex:1;overflow:hidden;}

    /* SIDEBAR */
    .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;flex-shrink:0;}
    .sidebar-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:0.9rem;color:var(--muted);transition:all 0.2s;margin-bottom:4px;}
    .sidebar-item:hover,.sidebar-item.active{background:rgba(108,99,255,0.15);color:var(--accent);}
    .sidebar-item span:first-child{font-size:1.1rem;}

    /* MAIN */
    .main{flex:1;overflow-y:auto;padding:28px;}
    .page-section{display:none;}
    .page-section.active{display:block;}

    /* STATS */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
    .stat-label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);}
    .stat-value{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-top:6px;}
    .stat-card:nth-child(1) .stat-value{color:var(--accent);}
    .stat-card:nth-child(2) .stat-value{color:var(--accent3);}
    .stat-card:nth-child(3) .stat-value{color:var(--accent2);}

    /* TABLE */
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .section-header h2{font-family:'Syne',sans-serif;font-size:1.2rem;}
    .add-btn{background:var(--accent);border:none;color:#fff;padding:10px 20px;border-radius:10px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;transition:all 0.3s;}
    .add-btn:hover{transform:translateY(-1px);box-shadow:0 5px 15px rgba(108,99,255,0.4);}

    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
    table{width:100%;border-collapse:collapse;}
    thead{background:var(--surface2);}
    th{padding:14px 16px;text-align:left;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);font-weight:600;}
    td{padding:14px 16px;border-top:1px solid var(--border);font-size:0.9rem;}
    tr:hover td{background:rgba(255,255,255,0.02);}

    .action-btn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:0.78rem;font-weight:600;transition:all 0.2s;margin-right:6px;}
    .edit-btn{background:rgba(108,99,255,0.15);color:var(--accent);}
    .edit-btn:hover{background:var(--accent);color:#fff;}
    .del-btn{background:rgba(255,77,109,0.15);color:var(--danger);}
    .del-btn:hover{background:var(--danger);color:#fff;}

    .stock-badge{padding:4px 10px;border-radius:6px;font-size:0.78rem;font-weight:600;}
    .stock-ok{background:rgba(67,233,123,0.15);color:var(--accent3);}
    .stock-low{background:rgba(255,77,109,0.15);color:var(--danger);}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:420px;animation:popIn 0.3s ease;}
    .modal h3{font-family:'Syne',sans-serif;font-size:1.1rem;margin-bottom:20px;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;margin-bottom:6px;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);}
    .form-group input,.form-group select{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:all 0.3s;}
    .form-group input:focus{border-color:var(--accent);}
    .form-group select option{background:var(--surface2);}
    .modal-btns{display:flex;gap:10px;margin-top:20px;}
    .save-btn{flex:1;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;transition:all 0.3s;}
    .save-btn:hover{background:#5a52e0;}
    .cancel-btn{flex:1;padding:13px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'Syne',sans-serif;font-weight:600;cursor:pointer;transition:all 0.3s;}
    .cancel-btn:hover{border-color:var(--danger);color:var(--danger);}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface2);border:1px solid var(--border);padding:12px 24px;border-radius:12px;font-size:0.9rem;transition:transform 0.3s;z-index:300;}
    .toast.show{transform:translateX(-50%) translateY(0);}

    @keyframes popIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
  </style>
</head>
<body>
  <nav>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="nav-logo">SHOP.JAVA</div>
      <span class="admin-badge">ADMIN</span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-item active" onclick="showSection('dashboard',this)"><span>📊</span> Dashboard</div>
      <div class="sidebar-item" onclick="showSection('products',this)"><span>📦</span> Products</div>
      <div class="sidebar-item" onclick="showSection('orders',this)"><span>🧾</span> Orders</div>
    </div>

    <div class="main">
      <!-- Dashboard -->
      <div class="page-section active" id="dashboard">
        <div class="stats">
          <div class="stat-card"><div class="stat-label">Total Products</div><div class="stat-value" id="statProducts">—</div></div>
          <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value" id="statOrders">—</div></div>
          <div class="stat-card"><div class="stat-label">Low Stock Items</div><div class="stat-value" id="statLow">—</div></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th></tr></thead>
            <tbody id="dashTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Products -->
      <div class="page-section" id="products">
        <div class="section-header">
          <h2>Manage Products</h2>
          <button class="add-btn" onclick="openAddModal()">+ Add Product</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
            <tbody id="productsTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Orders -->
      <div class="page-section" id="orders">
        <div class="section-header"><h2>All Orders</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th></tr></thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Add Product</h3>
      <input type="hidden" id="editId"/>
      <div class="form-group"><label>Product Name</label><input id="pName" placeholder="iPhone 15"/></div>
      <div class="form-group"><label>Category</label>
        <select id="pCategory">
          <option>Electronics</option><option>Footwear</option><option>Books</option><option>Clothing</option><option>Other</option>
        </select>
      </div>
      <div class="form-group"><label>Price (Rs.)</label><input id="pPrice" type="number" placeholder="9999"/></div>
      <div class="form-group"><label>Stock</label><input id="pStock" type="number" placeholder="10"/></div>
      <div class="form-group">
    <label>Image URL</label>
    <input id="pImage" placeholder="https://images.unsplash.com/..."/>
</div>
      <div class="modal-btns">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="save-btn" onclick="saveProduct()">Save Product</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let products = [];
    let orders   = [];

    async function loadData() {
      try {
        const [pr, or] = await Promise.all([
          fetch('http://localhost:8080/ECommerceApp/ProductServlet').then(r=>r.json()),
          fetch('http://localhost:8080/ECommerceApp/OrderServlet').then(r=>r.json())
        ]);
        products = pr.products || [];
        orders   = or.orders  || [];
      } catch(e) {
        // Demo data
        products = [
          {productId:1,name:'iPhone 15',category:'Electronics',price:79999,stock:10},
          {productId:2,name:'Nike Shoes',category:'Footwear',price:4999,stock:3},
          {productId:3,name:'Java Book',category:'Books',price:599,stock:50},
          {productId:4,name:'Headphones',category:'Electronics',price:1999,stock:15},
        ];
        orders = [
          {orderId:101,customerName:'Ishu Rana',orderDate:'2026-03-27',totalAmount:94118},
          {orderId:102,customerName:'Rahul S',orderDate:'2026-03-26',totalAmount:5899},
        ];
      }
      renderAll();
    }

    function renderAll() {
      // Stats
      document.getElementById('statProducts').textContent = products.length;
      document.getElementById('statOrders').textContent   = orders.length;
      document.getElementById('statLow').textContent      = products.filter(p=>p.stock<5).length;

      // Dashboard table
      document.getElementById('dashTable').innerHTML = products.map(p=>`
        <tr>
          <td>${p.name}</td><td>${p.category}</td>
          <td>Rs.${p.price.toLocaleString()}</td>
          <td><span class="stock-badge ${p.stock<5?'stock-low':'stock-ok'}">${p.stock}</span></td>
        </tr>`).join('');

      // Products table
      document.getElementById('productsTable').innerHTML = products.map(p=>`
        <tr>
          <td>#${p.productId}</td><td>${p.name}</td><td>${p.category}</td>
          <td>Rs.${p.price.toLocaleString()}</td>
          <td><span class="stock-badge ${p.stock<5?'stock-low':'stock-ok'}">${p.stock}</span></td>
          <td>
            <button class="action-btn edit-btn" onclick="openEditModal(${p.productId})">Edit</button>
            <button class="action-btn del-btn" onclick="deleteProduct(${p.productId})">Delete</button>
          </td>
        </tr>`).join('');

      // Orders table
      document.getElementById('ordersTable').innerHTML = orders.map(o=>`
        <tr>
          <td>#${o.orderId}</td><td>${o.customerName||o.name}</td>
          <td>${o.orderDate||o.order_date}</td>
          <td>Rs.${(o.totalAmount||o.total_amount||0).toLocaleString()}</td>
        </tr>`).join('');
    }

    function showSection(id, el) {
      document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));
      document.querySelectorAll('.sidebar-item').forEach(s=>s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Product';
      document.getElementById('editId').value = '';
      ['pName','pPrice','pStock'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('modalOverlay').classList.add('open');
    }

    function openEditModal(id) {
      const p = products.find(p=>p.productId===id);
      if(!p) return;
      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('editId').value = p.productId;
      document.getElementById('pName').value  = p.name;
      document.getElementById('pCategory').value = p.category;
      document.getElementById('pPrice').value = p.price;
      document.getElementById('pStock').value = p.stock;
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

    async function saveProduct() {
      const id    = document.getElementById('editId').value;
      const name  = document.getElementById('pName').value.trim();
      const cat   = document.getElementById('pCategory').value;
      const price = document.getElementById('pPrice').value;
      const stock = document.getElementById('pStock').value;
      if(!name||!price||!stock){showToast('❌ Fill all fields');return;}

      const image = document.getElementById('pImage').value.trim();
      const body = `name=${encodeURIComponent(name)}&category=${encodeURIComponent(cat)}&price=${price}&stock=${stock}&imageUrl=${encodeURIComponent(image)}${id ? `&productId=${id}&action=update` : '&action=add'}`;
      try {
        await fetch('http://localhost:8080/ECommerceApp/AdminServlet',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
      } catch(e) {
        // Demo: update locally
        if(id) { const p=products.find(p=>p.productId==id); if(p){p.name=name;p.category=cat;p.price=+price;p.stock=+stock;} }
        else products.push({productId:Date.now(),name,category:cat,price:+price,stock:+stock});
      }
      closeModal(); renderAll(); showToast(id?'✅ Product updated!':'✅ Product added!');
    }

    async function deleteProduct(id) {
      if(!confirm('Delete this product?')) return;
      try {
        await fetch('http://localhost:8080/ECommerceApp/AdminServlet',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`action=delete&productId=${id}`});
      } catch(e) { products = products.filter(p=>p.productId!==id); }
      renderAll(); showToast('🗑️ Product deleted!');
    }

    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
    function logout(){localStorage.clear();window.location.href='../index.html';}

    loadData();
  </script>
</body>
</html>
